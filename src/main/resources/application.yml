spring:
  application:
    name: roamate-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roamate}
    username: ${DB_USER:roamate}
    password: ${DB_PASSWORD:roamate}
    hikari:
      maximum-pool-size: 15

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-DDL
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

roamate:
  push:
    fcm-credentials-path: ${FCM_CREDENTIALS_PATH:}
    apns-key-path: ${APNS_KEY_PATH:}
  geo:
    location-request-timeout-ms: 5000
  # DEV-ONLY signing secret for AuthController's dev-login flow. MUST be
  # overridden via the JWT_SECRET env var with a real, long random value
  # (32+ bytes) before any non-local deployment - never ship this default.
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-before-deploying-anywhere}

logging:
  level:
    com.roamate: INFO
